# Mantiene activo el proyecto de Supabase: el plan gratuito lo pausa tras
# 7 días sin actividad. Cada 2 días hace una consulta real a la base (la
# misma que hace el geoportal) con la clave pública de config.js.
name: Mantener activo Supabase

on:
  schedule:
    - cron: '17 12 */2 * *'   # cada 2 días a las 12:17 UTC (08:17 en Bolivia)
  workflow_dispatch:           # también se puede ejecutar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar la base de Supabase
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js | head -1)
          CLAVE=$(grep -o "eyJ[A-Za-z0-9._-]*" config.js | head -1)
          cabeceras=(-H "apikey: $CLAVE" -H "Authorization: Bearer $CLAVE")
          echo "Versión de los datos:"
          curl -sS --fail --retry 3 --retry-delay 20 --max-time 60 \
            "$URL/rest/v1/geoportal_estado?select=version" "${cabeceras[@]}"
          echo
          # Consulta de cambios (respuesta pequeña): pasa por la base completa
          curl -sS --fail --retry 3 --retry-delay 20 --max-time 120 -o /dev/null -w "geoportal_cambios: HTTP %{http_code}\n" \
            -X POST "$URL/rest/v1/rpc/geoportal_cambios" "${cabeceras[@]}" \
            -H "Content-Type: application/json" -d '{"p_desde": "9999-01-01"}'

      # GitHub desactiva las tareas programadas de los repositorios públicos
      # sin actividad en 60 días: si el último cambio tiene más de 45 días,
      # se registra la fecha de esta consulta.
      - name: Mantener activa la tarea programada
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/ultima-consulta.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ultima-consulta.txt
            git commit -m "Mantener activa la consulta programada a Supabase"
            git push
          else
            echo "Hubo cambios en los últimos 45 días: no hace falta registrar nada."
          fi
